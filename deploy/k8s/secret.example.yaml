# Copy to secret.yaml (do not commit) or create with:
#   kubectl -n poruko create secret generic poruko-secret --from-env-file=secret.env
#
# Example secret.env:
#   APP_KEY=base64:...
#   DB_USERNAME=poruko
#   DB_PASSWORD=...
#   REDIS_PASSWORD=
#
apiVersion: v1
kind: Secret
metadata:
  name: poruko-secret
  namespace: poruko
type: Opaque
stringData:
  APP_KEY: "base64:REPLACE_ME"
  DB_USERNAME: poruko
  DB_PASSWORD: "change-me"
  REDIS_PASSWORD: ""
