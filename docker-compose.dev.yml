# Dev override (used by npm run up / scripts/dev.sh):
#   - COMPOSE_PROFILES=bundle is set by scripts/dev.sh so db + redis start
#   - Adds Postgres init script so poruko_test is created for automated tests
#   - Replaces the nginx web image with the Vite dev server (hot reload, API proxy)
#   - api/queue/scheduler use ./api/.env + ./api/.dev.env and bind-mount source
#   - Keeps PHP vendor/ on a Linux volume so Docker Desktop bind mounts stay fast
#
# Use: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  api:
    image: poruko-api:dev
    build:
      context: ./api
    env_file:
      - ./api/.env
      - ./api/.dev.env
    environment:
      RUN_MIGRATIONS: "false"
      SKIP_CONFIG_CACHE: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./api:/var/www/html
      - poruko-api-vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  queue:
    image: poruko-api:dev
    build:
      context: ./api
    env_file:
      - ./api/.env
      - ./api/.dev.env
    environment:
      RUN_MIGRATIONS: "false"
      SKIP_CONFIG_CACHE: "true"
    volumes:
      - ./api:/var/www/html
      - poruko-api-vendor:/var/www/html/vendor
    depends_on:
      - api
      - redis

  scheduler:
    image: poruko-api:dev
    build:
      context: ./api
    env_file:
      - ./api/.env
      - ./api/.dev.env
    environment:
      RUN_MIGRATIONS: "false"
      SKIP_CONFIG_CACHE: "true"
    volumes:
      - ./api:/var/www/html
      - poruko-api-vendor:/var/www/html/vendor
    depends_on:
      - api
      - redis

  db:
    ports:
      - "5432:5432"
    volumes:
      - poruko-db-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: poruko
      POSTGRES_USER: poruko
      POSTGRES_PASSWORD: poruko

  redis:
    ports:
      - "6379:6379"

  web:
    image: node:22-alpine
    container_name: poruko-web-dev
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      VITE_API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_started
    healthcheck:
      disable: true

volumes:
  poruko-api-vendor:
